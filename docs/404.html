<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <link rel="icon" href="./src/logos/logo_login.jpeg" type="image/png" sizes="32x32">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #1D2430;
            color: #f5f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #2F3646;
            border: 1px solid #414958;
            border-radius: 12px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .error-logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3c83f6;
            margin-bottom: 24px;
        }

        .error-code {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            color: #3c83f6;
            letter-spacing: 4px;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 12px 0 8px 0;
        }

        .error-message {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #3c83f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            height: 44px;
            padding: 0 28px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
        }

        .error-btn:hover {
            background-color: #2b6cd3;
        }

        .error-btn svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="./src/img/logo.jpg" alt="Logo" class="error-logo" />
        <div class="error-code">404</div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-message">La página que estás buscando no existe o fue movida. Verificá la dirección e intentá nuevamente.</p>
        <a class="error-btn" href="./index.html">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-house-fill" viewBox="0 0 16 16">
                <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
                <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
            </svg>
            Volver al inicio
        </a>
    </div>
</body>
</html>
